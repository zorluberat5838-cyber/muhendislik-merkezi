<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Paneli | Mühendislik Merkezi</title>
<style>
:root{
  --bg:#ffffff; --side:#f6f7f9; --line:#e4e8ee; --text:#18202b; --mute:#667385;
  --acc:#0b5cad; --acc-d:#094a8c; --acc-s:#e8f1fb;
  --danger:#b42318; --danger-s:#fdecea; --ok:#067647; --ok-s:#e7f6ee;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:4px 10px 14px;font-weight:700;font-size:16px;line-height:1.3}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.grp{margin:18px 10px 6px;font-size:13px;color:var(--mute);font-weight:600}
a.nav{display:block;padding:8px 10px;border-radius:6px;color:var(--text);text-decoration:none}
a.nav:hover{background:#eceff3}
a.nav.on{background:var(--acc-s);color:var(--acc-d);font-weight:600}
a.nav.sub{padding-left:22px}
.sidebar .out{margin-top:auto;padding-top:16px}
.sidebar .out button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--danger)}
.sidebar .out button:hover{background:var(--danger-s)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{color:var(--mute);font-size:14px}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
main{padding:26px 28px 60px;max-width:1100px;width:100%}

.btn{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;text-decoration:none;color:var(--text);font-size:14.5px;line-height:1.3}
.btn:hover{background:#f3f5f8}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-d)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-o{color:var(--danger)}
.btn.danger-o:hover{background:var(--danger-s)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.6;cursor:wait}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat .num{font-size:26px;font-weight:700;line-height:1.15}
.stat .lbl{color:var(--mute);font-size:13.5px;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{border:1px solid var(--line);border-radius:8px;padding:20px}
.panel h2{font-size:16px;margin:0 0 12px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.list li:first-child{border-top:0}
.list .d{color:var(--mute);font-size:13px;white-space:nowrap}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px;max-width:340px}
.toolbar .sp{flex:1}
.tablewrap{border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--side);font-size:13.5px;color:var(--mute);font-weight:600}
td.act{white-space:nowrap;text-align:right}
td .sub{color:var(--mute);font-size:13.5px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;color:var(--mute)}
.empty p{margin:0 0 12px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.req{color:var(--danger)}
input,textarea,select{width:100%;border:1px solid #cfd6df;border-radius:6px;padding:9px 11px;background:#fff}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus{border-color:var(--acc)}
.hint{color:var(--mute);font-size:13px;margin-top:4px}
.formerr{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--danger-s);color:var(--danger);font-size:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.note{margin:0 0 16px;padding:10px 12px;border-radius:6px;background:var(--acc-s);color:var(--acc-d);font-size:14px}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(580px,94vw);max-height:92vh;color:var(--text);background:#fff}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(20,28,40,.45)}
.dhead{padding:18px 20px 0}
.dhead h2,.dbody h2{margin:0;font-size:17px}
.dbody{padding:16px 20px;overflow:auto}
.dbody p{margin:8px 0 0}
.dfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.show{opacity:1}
#toast.ok{background:var(--ok);color:#fff}
#toast.err{background:var(--danger);color:#fff}

.loading{padding:50px 0;text-align:center;color:var(--mute)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none}

@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;width:272px}
  body.menu .sidebar{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(20,28,40,.4);z-index:20}
  .menubtn{display:block}
  .topbar{padding:12px 16px}
  .who{display:none}
  main{padding:18px 16px 60px}
  .cols,.grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .sidebar,#toast{transition:none}
  .spin{animation-duration:2s}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Ana menü">
    <div class="brand">Mühendislik Merkezi<small>Yönetim paneli</small></div>
    <nav>
      <a class="nav" href="#dashboard" data-v="dashboard">Dashboard</a>
      <div class="grp">Mühendislik içerikleri</div>
      <a class="nav sub" href="#eng-list" data-v="eng-list">Tüm içerikler</a>
      <a class="nav sub" href="#eng-form" data-v="eng-form">Yeni içerik</a>
      <a class="nav" href="#universities" data-v="universities">Üniversiteler</a>
      <a class="nav" href="#salaries" data-v="salaries">Maaşlar</a>
      <div class="grp">Haberler</div>
      <a class="nav sub" href="#news-list" data-v="news-list">Tüm haberler</a>
      <a class="nav sub" href="#news-form" data-v="news-form">Yeni haber</a>
      <div class="grp">Site</div>
      <a class="nav sub" href="#site" data-v="site">Site ayarları</a>
      <a class="nav sub" href="#look" data-v="look">Görünüm</a>
      <a class="nav sub" href="#account" data-v="account">Yönetici hesabı</a>
    </nav>
    <div class="out"><button type="button" id="logoutBtn">Çıkış yap</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="menubtn" id="menuBtn" aria-label="Menüyü aç">Menü</button>
      <h1 id="pageTitle">Dashboard</h1>
      <span class="who" id="who"></span>
      <a class="btn sm" href="/" target="_blank" rel="noopener">Siteyi aç</a>
    </header>
    <main id="view"><div class="loading"><span class="spin"></span>Yükleniyor…</div></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Bu panel JavaScript gerektirir.</noscript>

<script>
(function(){
"use strict";

/* ---------- yardımcılar ---------- */
var $ = function(s, r){ return (r || document).querySelector(s); };
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(v){
  var d = new Date(v);
  return isNaN(d) ? "" : d.toLocaleString("tr-TR", {dateStyle:"medium", timeStyle:"short"});
}
function byId(list, id){
  for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
  return null;
}

var data = {engineering:[], universities:[], salaries:[], news:[], siteSettings:{}};
var stats = null, adminName = "", ready = false;

/* ---------- API ---------- */
async function api(url, opt){
  opt = opt || {};
  var o = {method: opt.method || "GET", credentials: "same-origin", headers: {}};
  if (opt.body !== undefined){
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(opt.body);
  }
  var res;
  try { res = await fetch(url, o); }
  catch(e){ throw new Error("Sunucuya ulaşılamadı. İnternet bağlantını kontrol edip tekrar dene."); }
  if (res.status === 401){
    location.href = "/admin";
    throw new Error("Oturum sona erdi. Yeniden giriş yapman gerekiyor.");
  }
  var json = null;
  try { json = await res.json(); } catch(e){}
  if (!res.ok || (json && json.success === false)){
    throw new Error((json && json.message) || ("İşlem başarısız (kod " + res.status + ")."));
  }
  return json;
}

async function loadAll(){
  var r = await api("/api/admin/dashboard-data");
  data.engineering  = r.engineering  || [];
  data.universities = r.universities || [];
  data.salaries     = r.salaries     || [];
  data.news         = r.news         || [];
  data.siteSettings = r.siteSettings || {};
  try { stats = await api("/api/site-stats"); } catch(e){ stats = null; }
}

/* ---------- bildirim, modal ---------- */
var toastTimer;
function toast(msg, type){
  var t = $("#toast");
  t.textContent = msg;
  t.className = "show " + (type || "ok");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = ""; }, 3800);
}
function openModal(html){
  var d = $("#dlg");
  d.innerHTML = html;
  if (!d.open) d.showModal();
  return d;
}
function closeModal(){ var d = $("#dlg"); if (d.open) d.close(); }
function showErr(root, msg){
  var e = $(".formerr", root);
  if (e){ e.textContent = msg; e.hidden = false; }
}
function hideErr(root){ var e = $(".formerr", root); if (e) e.hidden = true; }
async function withBusy(btn, label, fn){
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  try { return await fn(); }
  finally { btn.disabled = false; btn.textContent = old; }
}

/* ---------- form alanları ---------- */
var F = {
  eng: [
    {k:"name",    l:"Mühendislik adı", req:1, full:1, ph:"Örn. Bilgisayar Mühendisliği"},
    {k:"kisa",    l:"Kısa açıklama", full:1, ph:"Kartta görünen kısa cümle"},
    {k:"nedir",   l:"Nedir?", t:"ta", full:1, rows:5},
    {k:"isler",   l:"Yapılan işler", t:"ta", h:"Her satıra bir madde yaz."},
    {k:"dersler", l:"Dersler", t:"ta", h:"Her satıra bir madde yaz."},
    {k:"alanlar", l:"Çalışma alanları", t:"ta", h:"Her satıra bir madde yaz."},
    {k:"etiket",  l:"Etiketler", t:"ta", h:"Her satıra bir etiket yaz."},
    {k:"uygun",   l:"Kimler için uygun?", t:"ta", full:1},
    {k:"kariyer", l:"Kariyer", t:"ta", full:1},
    {k:"salary",  l:"Maaş bilgisi", full:1}
  ],
  uni: [
    {k:"name", l:"Üniversite", req:1, full:1},
    {k:"department", l:"Bölüm", req:1, full:1},
    {k:"score", l:"Taban puan"},
    {k:"ranking", l:"Başarı sırası"}
  ],
  sal: [
    {k:"engineering", l:"Mühendislik", req:1, full:1},
    {k:"sector", l:"Sektör", req:1, list:["Özel","Kamu"]},
    {k:"year", l:"Yıl", req:1, t:"number"},
    {k:"salary", l:"Maaş", req:1, full:1, ph:"Örn. 70.100 TL"},
    {k:"source", l:"Kaynak", full:1}
  ],
  news: [
    {k:"title", l:"Haber başlığı", req:1, full:1},
    {k:"text", l:"Haber metni", req:1, t:"ta", full:1, rows:8}
  ],
  site: [
    {k:"site_name", l:"Site adı", req:1, full:1},
    {k:"site_description", l:"Site açıklaması", t:"ta", full:1, rows:3},
    {k:"technician", l:"Teknisyen / hazırlayan", full:1},
    {k:"footer_text", l:"Alt bilgi metni", t:"ta", full:1, rows:3}
  ],
  look: [
    {k:"hero_title", l:"Ana sayfa başlığı", req:1, full:1},
    {k:"hero_text", l:"Ana sayfa metni", t:"ta", full:1, rows:4}
  ],
  acc: [
    {k:"currentPassword", l:"Mevcut şifre", req:1, full:1, t:"password", ac:"current-password", raw:1},
    {k:"newName", l:"Yeni yönetici adı", full:1, h:"Değiştirmek istemiyorsan boş bırak."},
    {k:"newPassword", l:"Yeni şifre", t:"password", ac:"new-password", raw:1, h:"En az 8 karakter. Değiştirmek istemiyorsan boş bırak."},
    {k:"newPassword2", l:"Yeni şifre (tekrar)", t:"password", ac:"new-password", raw:1}
  ]
};

function fieldHTML(f, v){
  var id = "f_" + f.k, val = v == null ? "" : v, input;
  var ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : "";
  if (f.t === "ta"){
    input = '<textarea id="' + id + '" name="' + f.k + '" rows="' + (f.rows || 4) + '"' + ph + '>' + esc(val) + '</textarea>';
  } else {
    input = '<input id="' + id + '" name="' + f.k + '" type="' + (f.t || "text") + '" value="' + esc(val) + '"' + ph +
      (f.list ? ' list="dl_' + f.k + '"' : "") +
      (f.t === "number" ? ' inputmode="numeric"' : "") +
      (f.ac ? ' autocomplete="' + f.ac + '"' : ' autocomplete="off"') + '>';
    if (f.list){
      input += '<datalist id="dl_' + f.k + '">' + f.list.map(function(x){ return '<option value="' + esc(x) + '">'; }).join("") + '</datalist>';
    }
  }
  return '<div class="field' + (f.full ? " full" : "") + '"><label for="' + id + '">' + esc(f.l) +
    (f.req ? ' <span class="req">*</span>' : "") + '</label>' + input +
    (f.h ? '<div class="hint">' + esc(f.h) + '</div>' : "") + '</div>';
}
function formHTML(fields, values){
  values = values || {};
  return '<div class="grid">' + fields.map(function(f){ return fieldHTML(f, values[f.k]); }).join("") +
    '</div><div class="formerr" role="alert" hidden></div>';
}
function readForm(root, fields){
  var o = {};
  fields.forEach(function(f){
    var el = root.querySelector('[name="' + f.k + '"]');
    var v = el ? el.value : "";
    o[f.k] = f.raw ? v : v.trim();
  });
  return o;
}
function missing(fields, o){
  var m = fields.filter(function(f){ return f.req && !o[f.k]; });
  if (m.length) return "Şu alanlar gerekli: " + m.map(function(f){ return f.l; }).join(", ") + ".";
  for (var i = 0; i < fields.length; i++){
    if (fields[i].t === "number" && o[fields[i].k] && isNaN(Number(o[fields[i].k]))){
      return fields[i].l + " alanına sayı gir.";
    }
  }
  return "";
}

/* ---------- ortak parçalar ---------- */
function emptyBox(msg, href, label){
  return '<div class="empty"><p>' + esc(msg) + '</p>' +
    (href ? '<a class="btn primary" href="' + href + '">' + esc(label) + '</a>' : "") + '</div>';
}
function tableHTML(head, rows, emptyMsg, emptyAct){
  if (!rows) return '<div class="empty"><p>' + esc(emptyMsg) + '</p>' + (emptyAct || "") + '</div>';
  return '<div class="tablewrap"><table><thead><tr>' +
    head.map(function(h){ return "<th>" + esc(h) + "</th>"; }).join("") +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>";
}
function rowBtns(kind, id){
  return '<td class="act"><button type="button" class="btn sm" data-act="' + kind + '-edit" data-id="' + id + '">Düzenle</button> ' +
    '<button type="button" class="btn sm danger-o" data-act="' + kind + '-del" data-id="' + id + '">Sil</button></td>';
}
function entryModal(o){
  var d = openModal('<div class="dhead"><h2>' + esc(o.title) + '</h2></div><div class="dbody">' +
    formHTML(o.fields, o.values) + '</div><div class="dfoot"><button type="button" class="btn" data-x>Vazgeç</button>' +
    '<button type="button" class="btn primary" data-ok>Kaydet</button></div>');
  $("[data-x]", d).onclick = closeModal;
  var ok = $("[data-ok]", d);
  ok.onclick = async function(){
    var v = readForm(d, o.fields), m = missing(o.fields, v);
    if (m) return showErr(d, m);
    hideErr(d);
    try { await withBusy(ok, "Kaydediliyor…", function(){ return o.save(v); }); closeModal(); }
    catch(e){ showErr(d, e.message); }
  };
  var first = $("input,textarea", d); if (first) first.focus();
}
function confirmDelete(text, url){
  var d = openModal('<div class="dbody"><h2>Silmek istediğine emin misin?</h2><p>' + esc(text) +
    ' kalıcı olarak silinecek. Bu işlem geri alınamaz.</p><div class="formerr" role="alert" hidden></div></div>' +
    '<div class="dfoot"><button type="button" class="btn" data-x>Vazgeç</button>' +
    '<button type="button" class="btn danger" data-ok>Sil</button></div>');
  $("[data-x]", d).onclick = closeModal;
  var ok = $("[data-ok]", d);
  ok.onclick = async function(){
    try {
      var r = await withBusy(ok, "Siliniyor…", function(){ return api(url, {method:"DELETE"}); });
      closeModal(); await loadAll(); toast(r.message || "Silindi."); route();
    } catch(e){ showErr(d, e.message); }
  };
}

/* ---------- sayfalar ---------- */
function vDashboard(){
  var s = stats || {};
  var items = [
    ["Toplam ziyaretçi", s.totalVisitors], ["Bugünkü ziyaretçi", s.todayVisitors],
    ["Mühendislik", data.engineering.length], ["Üniversite", data.universities.length],
    ["Maaş kaydı", data.salaries.length], ["Haber", data.news.length]
  ];
  var cards = items.map(function(it){
    var n = it[1] == null ? "–" : Number(it[1]).toLocaleString("tr-TR");
    return '<div class="stat"><div class="num">' + esc(n) + '</div><div class="lbl">' + esc(it[0]) + '</div></div>';
  }).join("");
  var last = data.news.slice(0, 5).map(function(n){
    return '<li><span>' + esc(n.title) + '</span><span class="d">' + esc(fmtDate(n.created_at)) + '</span></li>';
  }).join("");
  $("#view").innerHTML =
    '<div class="stats">' + cards + '</div><div class="cols">' +
    '<div class="panel"><h2>Hızlı işlemler</h2><div class="quick">' +
      '<a class="btn primary" href="#eng-form">Yeni içerik</a><a class="btn" href="#news-form">Yeni haber</a>' +
      '<a class="btn" href="#universities">Üniversiteler</a><a class="btn" href="#salaries">Maaşlar</a></div></div>' +
    '<div class="panel"><h2>Son haberler</h2>' +
      (last ? '<ul class="list">' + last + '</ul>' : '<p class="hint">Henüz haber eklenmemiş.</p>') + '</div></div>';
}

function engRows(q){
  q = (q || "").toLowerCase();
  return data.engineering.filter(function(e){
    return !q || (e.name || "").toLowerCase().indexOf(q) > -1 || (e.kisa || "").toLowerCase().indexOf(q) > -1;
  }).map(function(e){
    return '<tr><td><strong>' + esc(e.name) + '</strong>' + (e.kisa ? '<div class="sub">' + esc(e.kisa) + '</div>' : "") +
      '</td><td>' + esc(e.salary) + '</td><td class="act"><a class="btn sm" href="#eng-form/' + e.id + '">Düzenle</a> ' +
      '<button type="button" class="btn sm danger-o" data-act="eng-del" data-id="' + e.id + '">Sil</button></td></tr>';
  }).join("");
}
function vEngList(){
  var add = '<a class="btn primary" href="#eng-form">Yeni içerik ekle</a>';
  $("#view").innerHTML =
    '<div class="toolbar"><input type="search" id="q" placeholder="İçeriklerde ara" aria-label="İçeriklerde ara"><span class="sp"></span>' + add + '</div>' +
    '<div id="engTable"></div>';
  function draw(){
    var q = $("#q").value;
    $("#engTable").innerHTML = tableHTML(["Mühendislik", "Maaş bilgisi", ""], engRows(q),
      q ? "Aramana uyan içerik bulunamadı." : "Henüz içerik eklenmemiş.", q ? "" : add);
  }
  $("#q").oninput = draw; draw();
}
function vEngForm(id){
  var vals = {};
  if (id){
    var it = byId(data.engineering, id);
    if (!it){ $("#view").innerHTML = emptyBox("Bu içerik bulunamadı. Silinmiş olabilir.", "#eng-list", "Listeye dön"); return; }
    vals = {name:it.name, kisa:it.kisa, nedir:it.nedir || it.description, isler:it.isler || it.work,
            dersler:it.dersler || it.education, alanlar:it.alanlar, uygun:it.uygun, kariyer:it.kariyer,
            etiket:it.etiket, salary:it.salary};
  }
  var root = $("#view");
  root.innerHTML = '<div class="panel">' + formHTML(F.eng, vals) + '<div class="actions"><a class="btn" href="#eng-list">Vazgeç</a>' +
    '<button type="button" class="btn primary" id="save">' + (id ? "Değişiklikleri kaydet" : "İçeriği yayınla") + '</button></div></div>';
  var btn = $("#save");
  btn.onclick = async function(){
    var v = readForm(root, F.eng), m = missing(F.eng, v);
    if (m) return showErr(root, m);
    hideErr(root);
    try {
      var r = await withBusy(btn, "Kaydediliyor…", function(){
        return api(id ? "/api/admin/engineering/" + id : "/api/admin/engineering", {method: id ? "PUT" : "POST", body: v});
      });
      await loadAll(); toast(r.message || "Kaydedildi."); location.hash = "#eng-list";
    } catch(e){ showErr(root, e.message); }
  };
}

function vUniversities(){
  var rows = data.universities.map(function(u){
    return '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.department) + '</td><td>' + esc(u.score) + '</td><td>' +
      esc(u.ranking) + '</td>' + rowBtns("uni", u.id) + '</tr>';
  }).join("");
  var add = '<button type="button" class="btn primary" data-act="uni-new">Yeni üniversite</button>';
  $("#view").innerHTML = '<div class="toolbar"><span class="sp"></span>' + add + '</div>' +
    tableHTML(["Üniversite", "Bölüm", "Taban puan", "Başarı sırası", ""], rows, "Henüz üniversite eklenmemiş.", add);
}
function uniModal(u){
  entryModal({title: u ? "Üniversiteyi düzenle" : "Yeni üniversite", fields: F.uni, values: u || {},
    save: async function(v){
      var r = await api(u ? "/api/admin/universities/" + u.id : "/api/admin/universities", {method: u ? "PUT" : "POST", body: v});
      await loadAll(); toast(r.message || "Kaydedildi."); route();
    }});
}

function vSalaries(){
  var rows = data.salaries.map(function(s){
    return '<tr><td>' + esc(s.engineering) + '</td><td>' + esc(s.sector) + '</td><td>' + esc(s.year) + '</td><td>' +
      esc(s.salary) + '</td><td>' + esc(s.source) + '</td>' + rowBtns("sal", s.id) + '</tr>';
  }).join("");
  var add = '<button type="button" class="btn primary" data-act="sal-new">Yeni maaş kaydı</button>';
  $("#view").innerHTML = '<div class="toolbar"><span class="sp"></span>' + add + '</div>' +
    tableHTML(["Mühendislik", "Sektör", "Yıl", "Maaş", "Kaynak", ""], rows, "Henüz maaş kaydı eklenmemiş.", add);
}
function salModal(s){
  entryModal({title: s ? "Maaş kaydını düzenle" : "Yeni maaş kaydı", fields: F.sal, values: s || {year: new Date().getFullYear()},
    save: async function(v){
      var r = await api(s ? "/api/admin/salaries/" + s.id : "/api/admin/salaries", {method: s ? "PUT" : "POST", body: v});
      await loadAll(); toast(r.message || "Kaydedildi."); route();
    }});
}

function vNewsList(){
  var rows = data.news.map(function(n){
    return '<tr><td><strong>' + esc(n.title) + '</strong></td><td>' + esc(fmtDate(n.created_at)) +
      '</td><td class="act"><a class="btn sm" href="#news-form/' + n.id + '">Düzenle</a> ' +
      '<button type="button" class="btn sm danger-o" data-act="news-del" data-id="' + n.id + '">Sil</button></td></tr>';
  }).join("");
  var add = '<a class="btn primary" href="#news-form">Yeni haber</a>';
  $("#view").innerHTML = '<div class="toolbar"><span class="sp"></span>' + add + '</div>' +
    tableHTML(["Başlık", "Tarih", ""], rows, "Henüz haber eklenmemiş.", add);
}
function vNewsForm(id){
  var vals = {};
  if (id){
    var n = byId(data.news, id);
    if (!n){ $("#view").innerHTML = emptyBox("Bu haber bulunamadı. Silinmiş olabilir.", "#news-list", "Listeye dön"); return; }
    vals = {title:n.title, text:n.text};
  }
  var root = $("#view");
  root.innerHTML = '<div class="panel">' + formHTML(F.news, vals) + '<div class="actions"><a class="btn" href="#news-list">Vazgeç</a>' +
    '<button type="button" class="btn primary" id="save">' + (id ? "Değişiklikleri kaydet" : "Haberi yayınla") + '</button></div></div>';
  var btn = $("#save");
  btn.onclick = async function(){
    var v = readForm(root, F.news), m = missing(F.news, v);
    if (m) return showErr(root, m);
    hideErr(root);
    try {
      var r = await withBusy(btn, "Kaydediliyor…", function(){
        return api(id ? "/api/admin/news/" + id : "/api/admin/news", {method: id ? "PUT" : "POST", body: v});
      });
      await loadAll(); toast(r.message || "Kaydedildi."); location.hash = "#news-list";
    } catch(e){ showErr(root, e.message); }
  };
}

function vSettings(kind){
  var fields = F[kind], root = $("#view");
  var intro = kind === "site"
    ? "Sitenin adı, açıklaması ve alt bilgisi. Kaydedince ana sitede hemen yayınlanır."
    : "Ana sayfanın üst bölümünde görünen başlık ve metin. Kaydedince ana sitede hemen yayınlanır.";
  root.innerHTML = '<div class="panel"><p class="note">' + esc(intro) + '</p>' + formHTML(fields, data.siteSettings) +
    '<div class="actions"><button type="button" class="btn primary" id="save">Kaydet ve yayınla</button></div></div>';
  var btn = $("#save");
  btn.onclick = async function(){
    var v = readForm(root, fields), m = missing(fields, v);
    if (m) return showErr(root, m);
    hideErr(root);
    try {
      var r = await withBusy(btn, "Kaydediliyor…", function(){ return api("/api/admin/customization", {method:"PUT", body: v}); });
      if (r.settings) data.siteSettings = r.settings;
      toast(r.message || "Kaydedildi.");
    } catch(e){ showErr(root, e.message); }
  };
}

function vAccount(){
  var root = $("#view");
  root.innerHTML = '<div class="panel"><p class="note">Giriş yapan yönetici: <strong>' + esc(adminName) +
    '</strong>. Ad veya şifreyi değiştirmek için mevcut şifreni gir.</p>' + formHTML(F.acc, {}) +
    '<div class="actions"><button type="button" class="btn primary" id="save">Hesabı güncelle</button></div></div>';
  var btn = $("#save");
  btn.onclick = async function(){
    var v = readForm(root, F.acc), m = missing(F.acc, v);
    if (m) return showErr(root, m);
    if (!v.newName.trim() && !v.newPassword) return showErr(root, "Değiştirmek için yeni ad veya yeni şifre gir.");
    if (v.newPassword && v.newPassword.length < 8) return showErr(root, "Yeni şifre en az 8 karakter olmalı.");
    if (v.newPassword !== v.newPassword2) return showErr(root, "Yeni şifre ile tekrarı aynı değil.");
    hideErr(root);
    try {
      var r = await withBusy(btn, "Güncelleniyor…", function(){
        return api("/api/admin/account", {method:"POST", body:{currentPassword: v.currentPassword, newName: v.newName.trim(), newPassword: v.newPassword}});
      });
      if (v.newName.trim()){ adminName = v.newName.trim(); setWho(); }
      toast(r.message || "Hesap güncellendi.");
      vAccount();
    } catch(e){ showErr(root, e.message); }
  };
}

/* ---------- tıklama işlemleri ---------- */
var act = {
  "uni-new":  function(){ uniModal(null); },
  "uni-edit": function(id){ var u = byId(data.universities, id); if (u) uniModal(u); },
  "uni-del":  function(id){ var u = byId(data.universities, id); if (u) confirmDelete(u.name + " – " + u.department, "/api/admin/universities/" + id); },
  "sal-new":  function(){ salModal(null); },
  "sal-edit": function(id){ var s = byId(data.salaries, id); if (s) salModal(s); },
  "sal-del":  function(id){ var s = byId(data.salaries, id); if (s) confirmDelete(s.engineering + " (" + s.year + ") maaş kaydı", "/api/admin/salaries/" + id); },
  "eng-del":  function(id){ var e = byId(data.engineering, id); if (e) confirmDelete(e.name, "/api/admin/engineering/" + id); },
  "news-del": function(id){ var n = byId(data.news, id); if (n) confirmDelete(n.title, "/api/admin/news/" + id); }
};
$("#view").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (b && act[b.dataset.act]) act[b.dataset.act](b.dataset.id);
});

/* ---------- yönlendirme ---------- */
var TITLES = {dashboard:"Dashboard", "eng-list":"Tüm içerikler", "eng-form":"Yeni içerik", universities:"Üniversiteler",
  salaries:"Maaşlar", "news-list":"Tüm haberler", "news-form":"Yeni haber", site:"Site ayarları", look:"Görünüm", account:"Yönetici hesabı"};
var VIEWS = {
  dashboard: vDashboard, "eng-list": vEngList, "eng-form": vEngForm, universities: vUniversities, salaries: vSalaries,
  "news-list": vNewsList, "news-form": vNewsForm,
  site: function(){ vSettings("site"); }, look: function(){ vSettings("look"); }, account: vAccount
};
function route(){
  if (!ready) return;
  var parts = (location.hash.slice(1) || "dashboard").split("/");
  var v = TITLES[parts[0]] ? parts[0] : "dashboard", arg = parts[1];
  var title = TITLES[v];
  if (v === "eng-form" && arg) title = "İçeriği düzenle";
  if (v === "news-form" && arg) title = "Haberi düzenle";
  var navKey = (v === "eng-form" && arg) ? "eng-list" : (v === "news-form" && arg) ? "news-list" : v;
  $("#pageTitle").textContent = title;
  document.title = title + " | Mühendislik Merkezi";
  document.querySelectorAll("a.nav").forEach(function(a){ a.classList.toggle("on", a.dataset.v === navKey); });
  document.body.classList.remove("menu");
  VIEWS[v](arg);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

function setWho(){ $("#who").textContent = adminName; }

/* ---------- menü, çıkış ---------- */
$("#menuBtn").onclick = function(){ document.body.classList.toggle("menu"); };
$("#scrim").onclick = function(){ document.body.classList.remove("menu"); };
$("#logoutBtn").onclick = async function(){
  try { await fetch("/api/logout", {credentials:"same-origin"}); } catch(e){}
  location.href = "/admin";
};

/* ---------- başlangıç ---------- */
async function boot(){
  $("#view").innerHTML = '<div class="loading"><span class="spin"></span>Yükleniyor…</div>';
  try {
    var s = await api("/api/admin/session");
    adminName = s.admin || "";
    setWho();
    await loadAll();
    ready = true;
    route();
  } catch(e){
    $("#view").innerHTML = '<div class="empty"><p>' + esc(e.message) + '</p><button type="button" class="btn primary" id="retry">Tekrar dene</button></div>';
    $("#retry").onclick = boot;
  }
}
boot();
})();
</script>
