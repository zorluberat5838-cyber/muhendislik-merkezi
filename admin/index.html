<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yönetici girişi | Mühendislik Merkezi</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f6f7f9;
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#18202b}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #e4e8ee;border-radius:10px;padding:30px 28px}
h1{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 22px;color:#667385;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input{width:100%;border:1px solid #cfd6df;border-radius:6px;padding:10px 12px;font:inherit}
input:focus{outline:2px solid #0b5cad;outline-offset:1px;border-color:#0b5cad}
button{width:100%;margin-top:22px;padding:11px;border:0;border-radius:6px;background:#0b5cad;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#094a8c}
button:disabled{opacity:.65;cursor:wait}
.err{margin-top:16px;padding:10px 12px;border-radius:6px;background:#fdecea;color:#b42318;font-size:14px}
.back{display:block;margin-top:18px;text-align:center;font-size:14px;color:#667385;text-decoration:none}
.back:hover{color:#0b5cad}
</style>
</head>
<body>
<div class="card">
  <h1>Yönetici girişi</h1>
  <p class="sub">Mühendislik Merkezi yönetim paneli</p>
  <form id="f" novalidate>
    <label for="name">Kullanıcı adı</label>
    <input id="name" name="name" autocomplete="username" autofocus>
    <label for="password">Şifre</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <div class="err" id="err" role="alert" hidden></div>
    <button type="submit" id="btn">Giriş yap</button>
  </form>
  <a class="back" href="/">Siteye dön</a>
</div>
<script>
(function(){
"use strict";
var f = document.getElementById("f"), btn = document.getElementById("btn"), err = document.getElementById("err");

function show(msg){ err.textContent = msg; err.hidden = false; }

// Oturum zaten açıksa doğrudan panele geç
fetch("/api/admin/session", {credentials:"same-origin"}).then(function(r){
  if (r.ok) location.replace("/admin/panel");
}).catch(function(){});

f.addEventListener("submit", async function(e){
  e.preventDefault();
  err.hidden = true;
  var name = f.name.value.trim(), password = f.password.value;
  if (!name || !password){ show("Kullanıcı adı ve şifre gerekli."); return; }
  btn.disabled = true; btn.textContent = "Giriş yapılıyor…";
  try {
    var res = await fetch("/api/login", {
      method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: name, password: password})
    });
    var json = null;
    try { json = await res.json(); } catch(x){}
    if (res.ok && json && json.success){ location.href = "/admin/panel"; return; }
    show((json && json.message) || "Giriş yapılamadı (kod " + res.status + ").");
  } catch(x){
    show("Sunucuya ulaşılamadı. İnternet bağlantını kontrol edip tekrar dene.");
  }
  btn.disabled = false; btn.textContent = "Giriş yap";
});
})();
</script>
</body>
</html>
