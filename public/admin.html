<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Kontrol Merkezi — BBZ Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Plus Jakarta Sans', sans-serif; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        .stat-num { font-size: 32px; font-weight: 800; color: #38bdf8; margin-top: 8px; }
        .console { background: #020617; border: 1px solid #334155; border-radius: 16px; padding: 20px; font-family: monospace; color: #38bdf8; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h2>🛡️ BBZ SaaS Yönetim Paneli</h2>
    <a href="/" style="color: #94a3b8; text-decoration: none;">← Ana Sayfaya Dön</a>
</div>

<div class="grid">
    <div class="stat-card">
        <div style="font-size: 12px; color: #94a3b8;">TOPLAM ZİYARETÇİ</div>
        <div class="stat-num">14,250</div>
    </div>
    <div class="stat-card">
        <div style="font-size: 12px; color: #94a3b8;">AKTİF MÜHENDİSLİK</div>
        <div class="stat-num">25</div>
    </div>
    <div class="stat-card">
        <div style="font-size: 12px; color: #94a3b8;">SİSTEM DURUMU</div>
        <div class="stat-num" style="color: #4ade80;">%100 Aktif</div>
    </div>
</div>

<div class="console">
    <h4 style="color: white; margin-bottom: 10px;">📡 Canlı Sunucu Logları</h4>
    <div id="logs">
        [SYSTEM] Sunucu başarıyla başlatıldı.<br>
        [API] Rest API yönlendirmeleri aktif.<br>
        [DATABASE] Veritabanı bağlantısı kuruldu.
    </div>
    <button class="btn" style="margin-top: 15px;" onclick="addLog()">Önbelleği Temizle & Log Bas</button>
</div>

<script>
function addLog() {
    const l = document.getElementById('logs');
    l.innerHTML += `<br>[ACTION] Önbellek temizlendi - ${new Date().toLocaleTimeString()}`;
}
</script>

</body>
</html>
